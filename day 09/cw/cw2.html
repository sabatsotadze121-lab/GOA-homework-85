<!-- 2)     შექმენით საკონტაქტო ფორმა, სადაც მომხმარებელმა უნდა შეიყვანოს სახელი, გვარი, ასაკი, მეილი,  -->
<!-- პაროლი და submit ღილაკი, გამოიყენეთ label თეგები თითოეულ ინფუთთან, მიანიჭეთ თითოეულ ინფუთს უნიკალური id შემდეგ კი ამ id ის დახმარებით დააკვაშირეთ label ებთან -->



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>საკონტაკტო ფორმა</title>
</head>
<body>
    <h1>კონტაქტი</h1>
    
    <form >
        <label for="user_name">სახელი</label>
        <input type="text"  id="user_name">

        <br>
        <br>

        <label for = "password">პაროლი</label>
        <input type="password"  id="password">

        <br>
        <br>

        <label for="age">ასაკი</label>
        <input type="number"  id="age">

        <br>
        <br>

        <label for="gmail">მეილი</label>
        <input type="email"  id="gmail">

        <br>
        <br>

        <label for="submit">დაადასტურე</label>
        <input type="submit"  id="submit">


    </form>
        
</body>
</html>
